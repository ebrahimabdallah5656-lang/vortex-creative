<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Vortex Admin | لوحة التحكم والمعالجة</title><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"></head>
<body style="background:#040405;"><header class="glass-header"><div class="logo"><span class="vortex-symbol">👑</span><span class="brand-title" style="font-size:1.1rem;">VORTEX <small style="color:#d4af37;">CONTROL</small></span></div><span id="admin-user-tag" class="gold-badge">المالك</span></header>
<main class="main-container"><section id="admin-tab-orders" class="tab-content active"><div class="section-header"><h2>إدارة الطلبات والحوالات</h2><p>متابعة الطلبات المفتوحة وتحديث حالة الدفع والتسليم</p></div><div id="admin-orders-list" class="orders-list"></div></section>
<section id="admin-tab-settings" class="tab-content"><div class="section-header"><h2>إعدادات المنصة وشروط الخصوصية</h2><p>تعديل الشروط والأرقام الأساسية</p></div><div class="glass-panel"><h3 style="color:#d4af37;margin-bottom:10px;">شروط الخصوصية والاستخدام</h3><textarea id="privacy-terms-text" class="glass-input" rows="8" placeholder="أدخل نصوص شروط الخصوصية والسياسات هنا..."></textarea><button class="btn-gold-solid" style="margin-top:15px;" onclick="savePrivacyTerms()">حفظ وتحديث الشروط</button></div></section></main>
<nav class="liquid-nav"><button class="nav-item active" onclick="switchAdminTab('orders', this)"><span class="icon">📊</span><span class="label">إدارة الطلبات</span></button><button class="nav-item" onclick="switchAdminTab('settings', this)"><span class="icon">⚙️</span><span class="label">الخصوصية والتعديل</span></button></nav><script src="admin.js"></script></body></html>
